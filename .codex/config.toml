# Nordstern AI Company v0.1
# Parent thread = CEO/COO

# Balanced defaults for normal company work. Escalate a specific task to
# gpt-5.6-sol / high only when its risk or complexity justifies the extra use.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_verbosity = "low"
service_tier = "default"

# Safe default: allow normal workspace work, but keep approval prompts available.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "low"

[features]
# Fast mode spends credits faster. Keep it unavailable in this project unless
# the user explicitly decides that urgency is worth the additional usage.
fast_mode = false
